<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBE1V1K Recovery Error</title>
<style>
:root{
  color-scheme:light dark;
  --page:#edf0f2;
  --surface:#ffffff;
  --ink:#1d2529;
  --muted:#667176;
  --line-strong:#bcc5c9;
  --accent:#c94f2d;
  --accent-dark:#a83e21;
  --danger:#a63d35;
  --danger-soft:#fcecea;
  --shadow:0 10px 28px rgba(31,43,49,.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --page:#101416;
    --surface:#191f22;
    --ink:#e3e8ea;
    --muted:#8e999e;
    --line-strong:#394247;
    --accent:#e06a45;
    --accent-dark:#c94f2d;
    --danger:#e0685e;
    --danger-soft:#331d1b;
    --shadow:0 10px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{
  min-height:100svh;
  margin:0;
  display:grid;
  place-items:center;
  color:var(--ink);
  background:var(--page);
  font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}
.panel{
  max-width:460px;
  margin:24px;
  padding:30px 32px;
  border:1px solid var(--line-strong);
  border-radius:8px;
  background:var(--surface);
  box-shadow:var(--shadow);
}
.mark{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:16px;
  border-radius:50%;
  color:var(--danger);
  background:var(--danger-soft);
  font-size:19px;
  font-weight:800;
}
h1{margin:0 0 8px;font-size:22px;font-weight:770}
p{margin:0 0 12px;color:var(--muted)}
.back{
  display:inline-flex;
  align-items:center;
  min-height:42px;
  margin-top:6px;
  padding:0 18px;
  border:1px solid var(--accent-dark);
  border-radius:7px;
  color:#ffffff;
  background:var(--accent);
  font-weight:730;
  text-decoration:none;
}
.back:hover{background:var(--accent-dark)}
</style>
</head>
<body>
  <div class="panel">
    <span class="mark">!</span>
    <h1>Upload rejected</h1>
    <p>The recovery server refused this operation. Check the selected target and image file, then review the serial console for details.</p>
    <a class="back" href="/index.html">Return to recovery console</a>
  </div>
</body>
</html>
